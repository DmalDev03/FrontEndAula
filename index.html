
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }

    h2 {
      color: #333;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    button {
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f9fafb;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .completed {
      text-decoration: line-through;
      color: gray;
    }

    .delete-btn {
      background: #ef4444;
      padding: 6px 10px;
    }

    .delete-btn:hover {
      background: #dc2626;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Minha Lista de Tarefas</h2>

    <div class="input-group">
      <input type="text" id="tarefa" placeholder="Digite uma tarefa">
      <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <ul id="lista"></ul>

    <p id="contador">Tarefas pendentes: 0</p>

  </div>

  <script>
    function adicionarTarefa() {

      const campo = document.getElementById("tarefa");
      const texto = campo.value.trim();

      if (texto === "") {
        alert("Digite uma tarefa!");
        return;
      }

      const lista = document.getElementById("lista");

      const item = document.createElement("li");

      const textoTarefa = document.createElement("span");
      textoTarefa.textContent = texto;

      // Marcar como concluída
      textoTarefa.onclick = function() {
        textoTarefa.classList.toggle("completed");
        atualizarContador();
      };

      // Botão excluir
      const botaoExcluir = document.createElement("button");
      botaoExcluir.textContent = "Excluir";
      botaoExcluir.className = "delete-btn";

      botaoExcluir.onclick = function() {
        item.remove();
        atualizarContador();
      };

      item.appendChild(textoTarefa);
      item.appendChild(botaoExcluir);

      lista.appendChild(item);

      campo.value = "";

      atualizarContador();
    }

    // Atualizar quantidade de tarefas pendentes
    function atualizarContador() {

      const lista = document.getElementById("lista");
      const tarefas = lista.querySelectorAll("li");

      let pendentes = 0;

      tarefas.forEach(function(item) {
        if (!item.querySelector("span").classList.contains("completed")) {
          pendentes++;
        }
      });

      document.getElementById("contador").textContent =
        "Tarefas pendentes: " + pendentes;
    }
  </script>

</body>
</html>
